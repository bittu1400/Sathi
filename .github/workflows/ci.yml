name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy values so modules that read env at import time can't break the build.
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_ROLE_KEY: dummy
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SOS_SMS_NUMBER: "+9770000000000"
      NEXT_PUBLIC_DEMO: "1"
      ESEWA_PRODUCT_CODE: EPAYTEST
      ESEWA_SECRET_KEY: dummy
      ESEWA_FORM_URL: https://rc-epay.esewa.com.np/api/epay/main/v2/form
      ESEWA_STATUS_URL: https://rc.esewa.com.np/api/epay/transaction/status/
      ANTHROPIC_API_KEY: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Guard - private docs must never be in this public repo
        run: |
          if [ -n "$(git ls-files docs)" ]; then
            echo "::error::docs/ is the private sathi-docs repo and must never be committed here"; exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
